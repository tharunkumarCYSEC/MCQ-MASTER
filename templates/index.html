<!DOCTYPE html>
<html>
<head>
    <title>my quiz maker</title>
    <style>
        body { background: black; color: green; font-family: monospace; }
        .box { width: 400px; margin: 50px auto; background: #111; padding: 20px; border: 1px solid green; }
        textarea { width: 100%; height: 100px; background: black; color: green; border: 1px solid green; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="box">
        <h2>MCQ Generator app</h2>
        
        <label>Upload txt file:</label><br>
        <input type="file" id="fileBox"><br><br>
        
        <label>Or type text:</label><br>
        <textarea id="textBox" placeholder="paste notes..."></textarea><br><br>
        
        <button id="makeBtn" type="button">Make Quiz!</button>
        
        <p id="err" class="error"></p>
    </div>

    <div id="quizDiv" class="box" style="display:none;">
        <h2>Here is your quiz:</h2>
        <div id="questionsArea"></div>
        <button type="button" onclick="checkScore()">Check Score</button>
        <h3 id="scoreBox"></h3>
    </div>

    <script>
        let allQuestions = [];

        document.getElementById('makeBtn').onclick = async function() {
            document.getElementById('err').innerText = "";
            
            let fInput = document.getElementById('fileBox').files[0];
            let tInput = document.getElementById('textBox').value;
            
            let data = new FormData();
            if (fInput) {
                data.append('file', fInput);
            } else {
                data.append('text', tInput);
            }

            let res = await fetch('/generate', {
                method: 'POST',
                body: data
            });
            
            let json = await res.json();
            
            if (json.success == false) {
                document.getElementById('err').innerText = json.error;
                return;
            }

            allQuestions = json.mcqs;
            let area = document.getElementById('questionsArea');
            area.innerHTML = "";

            for (let i = 0; i < allQuestions.length; i++) {
                let q = allQuestions[i];
                let html = "<p><b>Q" + (i+1) + ": " + q.question + "</b></p>";
                
                for (let j = 0; j < q.options.length; j++) {
                    html += '<input type="radio" name="q_' + q.id + '" value="' + j + '"> ' + q.options[j] + '<br>';
                }
                area.innerHTML += html + "<br>";
            }

            document.getElementById('quizDiv').style.display = "block";
        }

        function checkScore() {
            let score = 0;
            for (let i = 0; i < allQuestions.length; i++) {
                let q = allQuestions[i];
                let chosen = document.querySelector('input[name="q_' + q.id + '"]:checked');
                if (chosen) {
                    if (parseInt(chosen.value) == q.correct) {
                        score = score + 1;
                    }
                }
            }
            document.getElementById('scoreBox').innerText = "You got " + score + " / " + allQuestions.length;
        }
    </script>
</body>
</html>
